<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Lost in the closet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Fraunces:opsz,wght@9..144,400&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{
    min-height:100svh;margin:0;display:grid;place-items:center;padding:24px;
    background:radial-gradient(52% 40% at 78% 8%,#fbe0e8,transparent 60%),radial-gradient(46% 36% at 12% 88%,#f7e8d3,transparent 62%),linear-gradient(155deg,#fff4f1,#fff9ee 55%,#fdeff2);
    color:#432c34;font:15px/1.7 Poppins,system-ui,sans-serif;text-align:center;
  }
  main{max-width:520px}
  .heart{font-size:40px;color:#d98fa5}
  h1{font:400 clamp(34px,8vw,56px)/1.1 Fraunces,Georgia,serif;margin:14px 0 12px}
  p{color:#8a6f77;margin:0 0 24px}
  a{
    display:inline-block;padding:13px 24px;border-radius:999px;background:linear-gradient(135deg,#4b3039,#5f3f4a);
    color:#fff6ee;text-decoration:none;font-weight:600;box-shadow:0 14px 30px #4b303933
  }
  a:hover{background:linear-gradient(135deg,#5a3a45,#6d4a55)}
  small{display:block;margin-top:22px;color:#b39aa1;font-size:11px;letter-spacing:.08em}
</style>
</head>
<body>
<main>
  <div class="heart" aria-hidden="true">♡</div>
  <h1>This page isn’t in the closet.</h1>
  <p>But the closet itself is still exactly where you left it — every world, every ribbon, every note.</p>
  <a href="./index.html">Back to her closet</a>
  <small>MADE BY HAND, WITH LOVE</small>
</main>
</body>
</html>

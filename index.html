function toast(text,love=true){notices.innerHTML=`<aside class="toast">${esc(text)}${btn('dismiss','×','',`aria-label="Dismiss message"`)}</aside>`;if(love)spark('heart');clearTimeout(toast.timer);toast.timer=setTimeout(()=>notices.innerHTML='',6500)}
function interaction(){interactions++;if(interactions%5===0&&Date.now()-lastToast>40000){if(!toastBag.length)toastBag=messages.map((_,i)=>i).sort(()=>Math.random()-.5);lastToast=Date.now();toast(messages[toastBag.pop()])}}
function frame(t){if(document.hidden){lastFrame=t;requestAnimationFrame(frame);return}const dt=Math.min((t-lastFrame)/1000||0,.04);lastFrame=t;cx.clearRect(0,0,width,height);if(!reduced&&(screen==='home'||screen==='letter')&&t-petalAt>650&&particles.length<35){petalAt=t;particles.push({x:Math.random()*width,y:-20,vx:8+Math.random()*12,vy:25+Math.random()*20,life:30,age:0,size:4+Math.random()*5,kind:'petal',c:'#dca2b2',rot:Math.random()*6})}particles=particles.filter(p=>p.age<p.life&&p.y<height+30);for(const p of particles){p.age+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(p.kind!=='petal')p.vy+=100*dt;cx.save();cx.translate(p.x,p.y);cx.rotate(p.rot+p.age);cx.globalAlpha=p.kind==='petal'?.38:Math.min(1,(p.life-p.age)*1.5);cx.fillStyle=p.c;if(p.kind==='heart'){cx.beginPath();cx.moveTo(0,4);cx.bezierCurveTo(-15,-4,-6,-12,0,-5);cx.bezierCurveTo(6,-12,15,-4,0,4);cx.fill()}else if(p.kind==='petal'){cx.beginPath();cx.ellipse(0,0,p.size,p.size*.5,.5,0,Math.PI*2);cx.fill()}else if(p.kind==='confetti')cx.fillRect(-p.size/2,-p.size/2,p.size,p.size*.5);else{cx.beginPath();cx.moveTo(0,-p.size);cx.lineTo(2,0);cx.lineTo(0,p.size);cx.lineTo(-2,0);cx.fill()}cx.restore()}if(screen==='letter'&&letterOpen&&letterIndex<letterText.length){letterIndex=reduced?letterText.length:Math.min(letterText.length,Math.floor((t-typeStart)/22));updateLetter()}if(result&&document.getElementById('scoreNumber')){let progress=reduced?1:Math.min(1,(t-scoreStart)/1200),n=Math.round(result.total*(1-Math.pow(1-progress,3)));document.getElementById('scoreNumber').textContent=n;document.getElementById('meterArc').setAttribute('stroke-dashoffset',100-n);let chars=reduced?result.message.length:Math.max(0,Math.floor((t-scoreStart-1100)/25));document.getElementById('tierMessage').textContent=result.message.slice(0,chars)}if(audio&&saved.sound&&t-nextMusic>0){music();nextMusic=t+720}requestAnimationFrame(frame)}requestAnimationFrame(frame);
/* ==================== AUDIO ==================== */
let audio=null,nextMusic=0,musicIndex=0;
function initAudio(){try{if(!audio){const A=window.AudioContext||window.webkitAudioContext;if(A)audio=new A()}if(audio?.state==='suspended')audio.resume().catch(()=>{})}catch(e){audio=null}}
function note(freq,delay=0,duration=.5,vol=.025){if(!saved.sound||!audio||document.hidden||audio.state!=='running')return;try{const osc=audio.createOscillator(),gain=audio.createGain(),t=audio.currentTime+delay;osc.type='sine';osc.frequency.value=freq;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(vol,t+.012);gain.gain.exponentialRampToValueAtTime(.0001,t+duration);osc.connect(gain);gain.connect(audio.destination);osc.start(t);osc.stop(t+duration+.02);osc.onended=()=>{osc.disconnect();gain.disconnect()}}catch(e){}}
function tone(kind){if(!saved.sound)return;initAudio();const patterns={click:[660],sparkle:[523,659,784,1047],fanfare:[523,659,784,1047,1319],envelope:[392,523,659]};(patterns[kind]||patterns.click).forEach((f,i)=>note(f,i*.09,kind==='click'?.12:.7,kind==='click'?.013:.024))}
function music(){const scale=[0,2,4,7,9,12,9,7,4,2,7,4],m=worlds[world].mood;note(261.63*Math.pow(2,(scale[musicIndex++%scale.length]+m)/12),0,1.8,.009)}
document.addEventListener('visibilitychange',()=>{document.body.classList.toggle('paused',document.hidden);if(document.hidden){pausedAt=performance.now();audio?.suspend().catch(()=>{})}else{const gap=performance.now()-pausedAt;typeStart+=gap;scoreStart+=gap;nextMusic=performance.now()+400;if(saved.sound&&audio)audio.resume().catch(()=>{})}});
/* ==================== EASTER EGGS ==================== */
function egg(which){if(which==='his'){spark('confetti');toast('You found it! 🥹 Of course you did.');if(unlock())celebrate()}else{spark('spark');toast(`A whole shower of sparkles for ${pet}. Of course.`)}}
/* ==================== EVENTS & NAVIGATION ==================== */
function nav(next){close();screen=next;render();window.scrollTo(0,0)}
function switchWorld(n){world=n;screen='studio';filter='current';category='top';close();render();const wipe=document.createElement('div');wipe.className='wipe';document.body.append(wipe);setTimeout(()=>wipe.remove(),700);tone('sparkle');spark();window.scrollTo(0,0)}
document.addEventListener('click',e=>{if(saved.sound&&!audio)initAudio();if(e.target.closest('[data-title]')){if(++titleTaps%7===0)egg('her')}const b=e.target.closest('[data-act]');if(!b)return;let a=b.dataset.act,n=Number(b.dataset.n),id=b.dataset.id,key=b.dataset.key;if(a==='open'){letterOpen=true;letterIndex=0;renderLetter();tone('envelope');spark('heart')}else if(a==='skip'){letterIndex=letterText.length;updateLetter()}else if(a==='enter'){saved.seen=true;persist();nav(letterReturn)}else if(a==='home')nav('home');else if(a==='worlds')nav('worlds');else if(a==='world')switchWorld(n);else if(a==='menu')menu();else if(a==='close')close();else if(a==='dismiss')notices.innerHTML='';else if(a==='replay'){letterReturn=screen==='letter'?'home':screen;close();screen='letter';letterOpen=false;letterIndex=0;render()}else if(a==='sound'){saved.sound=!saved.sound;if(saved.sound){initAudio();tone('sparkle')}else audio?.suspend().catch(()=>{});persist();render()}else if(a==='category'){category=id;render();document.querySelector('.tabs .selected')?.scrollIntoView({block:'nearest',inline:'center'});interaction()}else if(a==='wear')wear(id,Number(b.dataset.v));else if(a==='undo'){if(history.length){future.push(copy(look));look=history.pop();render();tone('click')}}else if(a==='redo'){if(future.length){history.push(copy(look));look=future.pop();render();tone('click')}}else if(a==='reset')dialog('A fresh canvas?',`<p class="muted">Remove your outfit and makeup? Your Mirror settings stay. Undo can bring everything back.</p><div class="row" style="margin-top:20px">${btn('doreset','Start fresh','primary')}${btn('close','Keep my look')}</div>`);else if(a==='doreset'){close();change(()=>{look.items={};look.face=fresh().face})}else if(a==='clear'){change(()=>{if(category==='makeup')look.face=fresh().face;else if(category==='fave')Object.keys(look.items).forEach(k=>{if(byId[look.items[k].id]?.world===5)delete look.items[k]});else{const slots=category==='bling'?['neck','ears','glasses','back','tights']:category==='hair'?['head']:[category];slots.forEach(s=>delete look.items[s])}})}else if(a==='shuffle'){change(()=>{look.items={};const v=Math.floor(Math.random()*3),slots=Math.random()<.45?['dress','shoes','head','neck','ears','bag']:['top','bottom','shoes','head','neck','ears','bag'];if(Math.random()<.35)slots.push('layer');slots.forEach(slot=>{const pool=catalog.filter(i=>i.world===world&&i.slot===slot);const item=pool[Math.floor(Math.random()*pool.length)];if(item)look.items[slot]={id:item.id,v}})})}else if(a==='mirror')mirror();else if(a==='mirrorcolor'){change(()=>look[key]=b.dataset.color);mirror()}else if(a==='hairstyle'){change(()=>look.hair=id);mirror()}else if(a==='makeup')change(()=>look.face[key]=n);else if(a==='togglemakeup')change(()=>look.face[key]=!look.face[key]);else if(a==='serve')serve();else if(a==='another'){nav('worlds')}else if(a==='save')exportLook();else if(a==='share')exportLook(true);else if(a==='book')book();else if(a==='notes')noteScreen();else if(a==='readnote')readNote(n);else if(a==='lockednote')toast('One little letter for every three looks. No rush.',false);else if(a==='rewear'){const entry=saved.book[n];if(entry){history.push(copy(look));future=[];look=copy(entry.look);world=entry.world;nav('studio');spark()}}else if(a==='delete')dialog('Let this look go?',`<p>This removes it from the Look Book, not your downloaded photos.</p><div class="row" style="margin-top:20px">${btn('confirmdelete','Delete look','primary',`data-n="${n}"`)}${btn('book','Keep it')}</div>`);else if(a==='confirmdelete'){saved.book.splice(n,1);persist();book()}else if(a==='heart'){if(++footerTaps%5===0)egg('his')}else if(a==='gotofave'){pendingCelebrate=false;close();screen='studio';category='fave';render()}else if(a==='fullfave'&&saved.unlocked){change(()=>{look.items={};catalog.filter(i=>i.world===5).forEach((i,j)=>look.items[i.slot]={id:i.id,v:j%2})});spark('heart')}});
document.addEventListener('change',e=>{if(e.target.id==='worldFilter'){filter=e.target.value;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML){close();return}if(e.key==='Tab'&&modal.innerHTML){const focusables=[...modal.querySelectorAll('button,input,select,[tabindex="0"]')].filter(el=>!el.disabled);const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.paper[data-act]')){e.preventDefault();letterIndex=letterText.length;updateLetter()}if(/input|textarea|select/i.test(e.target.tagName)||e.target.isContentEditable||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key.length===1&&/[a-z]/i.test(e.key)){keyBuffer=(keyBuffer+e.key.toUpperCase()).slice(-40);if(keyBuffer.endsWith('JOSHUA')||keyBuffer.endsWith(him.toUpperCase())){egg('his');keyBuffer=''}else if(keyBuffer.endsWith('FATUMAH')||keyBuffer.endsWith(her.toUpperCase())){egg('her');keyBuffer=''}}});
render();
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
})();
</script>
